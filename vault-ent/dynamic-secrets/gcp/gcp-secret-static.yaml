apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultDynamicSecret
metadata:
  name: vso-gcp-key
  namespace: gcp
spec:
  # Mount path of the secrets backend
  mount: gcp
  namespace: dev
  # Path to the secret
  path: static-account/${PROJECT_ID}-viewer-key/key

  # Where to store the secrets, VSO will create the secret
  destination:
    create: true
    name: vso-gcp-key
    transformation:
      excludes:
      - .*
      templates:
        gcp_sa:  
          text: |-
            {{- printf (get .Secrets "private_key_data" | b64dec ) -}}

#  # Restart these pods when secrets rotated
  rolloutRestartTargets:
  - kind: Deployment
    name: gcp-app
#
  # Name of the CRD to authenticate to Vault
  vaultAuthRef: gcp-dynamic-auth
